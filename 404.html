<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Aaron Royan</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300..600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .lost {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-content: space-between;
      gap: 3rem;
      padding: 28px var(--gutter);
    }
    .lost__head, .lost__foot {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--fg-3);
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .lost__code {
      font: italic 400 clamp(7rem, 34vw, 30rem)/0.8 var(--serif);
      letter-spacing: -0.04em;
    }
    .lost__text {
      max-width: 26ch;
      margin-top: 1.5rem;
      font: 400 clamp(1.6rem, 3vw, 3rem)/1.08 var(--serif);
    }
    .lost__foot a { color: var(--fg); }
    .lost__foot a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost__head mono"><p>Aaron Royan</p><p>Error 404</p></div>
    <div>
      <h1 class="lost__code">404</h1>
      <p class="lost__text">This stop isn’t on the route. The page may have moved when the site was rebuilt.</p>
    </div>
    <div class="lost__foot mono"><a href="/">← Back to the homepage</a><a href="mailto:aaron.dom.royan@gmail.com">aaron.dom.royan@gmail.com</a></div>
  </main>
</body>
</html>
